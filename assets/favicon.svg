<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Marjo Seki">
  <!-- Sakura mark in the site palette. Shapes are deliberately chunky so the
       icon still reads as a blossom at 16px in a browser tab. -->
  <rect width="64" height="64" rx="16" fill="#e7f7e0"/>
  <g transform="translate(32 33)">
    <g fill="#e6afbe">
      <ellipse cx="0" cy="-15" rx="8.5" ry="12"/>
      <ellipse cx="0" cy="-15" rx="8.5" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-15" rx="8.5" ry="12" transform="rotate(144)"/>
      <ellipse cx="0" cy="-15" rx="8.5" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-15" rx="8.5" ry="12" transform="rotate(288)"/>
    </g>
    <g fill="#c37f95" opacity="0.55">
      <ellipse cx="0" cy="-21" rx="3.2" ry="4"/>
      <ellipse cx="0" cy="-21" rx="3.2" ry="4" transform="rotate(72)"/>
      <ellipse cx="0" cy="-21" rx="3.2" ry="4" transform="rotate(144)"/>
      <ellipse cx="0" cy="-21" rx="3.2" ry="4" transform="rotate(216)"/>
      <ellipse cx="0" cy="-21" rx="3.2" ry="4" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="6.5" fill="#f0c478"/>
    <circle cx="0" cy="0" r="3" fill="#d69a45"/>
  </g>
</svg>
